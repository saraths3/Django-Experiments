{% load static %}

<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biscuits{% endblock title %}</title>
    
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
</head>
<body class="d-flex flex-column h-100">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase tracking-wider" href="#">🍪 Biscuits</a>
            <button class="navbar-toggler" type="text/gradient" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-shrink-0 my-5">
        <div class="container">
            {% block content %}
            <div class="text-center py-5 bg-blur rounded-4 shadow-sm hero-box">
                <h2 class="display-5 fw-bold text-dark mb-3">Welcome to this Django Project</h2>
                <p class="lead text-muted">A beautifully structured starter template using Bootstrap 5.</p>
                <a href="" class="btn btn-primary btn-lg px-4 gap-3 rounded-pill mt-3">Get Started</a>
            </div>
            {% endblock %}
        </div>
    </main>

    <!-- Sticky Footer -->
    <footer class="footer mt-auto py-4 border-top">
        <div class="container text-center">
            <span class="text-muted">&copy; 2026 Biscuits Inc. All rights reserved.</span>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
